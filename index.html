<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  />

  <title>かざすだけ かんばん照合</title>

  <link rel="stylesheet" href="style.css" />

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>

<body>
  <main>
    <div id="result">🟡 カメラ開始待ち</div>

    <button id="startButton" type="button">
      カメラを開始
    </button>
   
    <div class="mode-buttons">
  <button id="partModeButton" type="button">
    品番照合
  </button>

  <button id="backModeButton" type="button">
    背番照合
  </button>
</div>

    <button id="settingsButton" type="button">
  ⚙️ 枠を調整
 <div id="widthControls">
  <button id="narrowButton" type="button">
    － 狭く
  </button>

  <button id="wideButton" type="button">
    ＋ 広く
  </button>
</div> 
</button>

    <div class="camera-area">
      <video id="camera" autoplay playsinline muted></video>

      <div class="ocr-area ocr-area-top"></div>
      <div class="ocr-area ocr-area-bottom"></div>

      <div class="guide guide-top">
        <div class="guide-label">上：照合板</div>
      </div>

      <div class="guide guide-bottom">
        <div class="guide-label">下：出荷かんばん</div>
      </div>
    </div>

    <div id="details">
上側：未読取
下側：未読取
    </div>

    <canvas id="captureCanvas" hidden></canvas>
  </main>

  <script src="script.js?v=23"></script>
</body>
</html>
